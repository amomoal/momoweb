<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web制作サンプル一覧 | momo web</title>
  <meta
    name="description"
    content="momo webが制作するWebサイトのデザインサンプル一覧です。架空の店舗・人物を用いた制作イメージをご覧いただけます。"
  >

  <link rel="stylesheet" href="../reset.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="site-shell">

    <a class="back-link" href="../index.html">← momoweb トップへ戻る</a>

    <section class="section" style="margin-top: 20px;">
      <div class="section__header">
        <p class="section__label">Web Samples</p>
        <h1 class="section__title">Web制作サンプル入り口</h1>
      </div>

      <div class="panel">
        <p class="body-text">
          実際のご依頼を想定して制作した、デザインサンプルサイトの入り口ページです。
          掲載している店舗・人物・情報はすべて架空のものですが、
          制作の雰囲気やクオリティの参考としてご覧いただけます。
        </p>
      </div>
    </section>

    <section class="section" id="samples">
      <div class="section__header">
        <p class="section__label">Samples</p>
        <h2 class="section__title">サンプル一覧</h2>
      </div>

      <div class="sample-list">

        <a class="sample-card" href="./salon_yohaku/index.html">
          <div class="sample-card__thumb">
            <img
              src="./salon_yohaku/assets/image/salon-interior.png"
              alt="ヘアサロンYOHAKUサンプルサイトのイメージ画像"
              loading="lazy"
            >
          </div>
          <div class="sample-card__body">
            <p class="sample-card__eyebrow">Hair Salon</p>
            <div class="sample-card__title-row">
              <h3 class="sample-card__title">ヘアサロン YOHAKU</h3>
              <span class="platform-badge">1ページ / スマホ対応</span>
            </div>
            <p class="sample-card__desc">
              ナチュラル×ミニマルな雰囲気を意識した、小規模美容室のイメージサイトです。
            </p>
          </div>
        </a>

        <div class="sample-card sample-card--soon">
          <div class="sample-card__thumb sample-card__thumb--placeholder">Coming soon</div>
          <div class="sample-card__body">
            <p class="sample-card__eyebrow">準備中</p>
            <h3 class="sample-card__title">次のサンプル</h3>
            <p class="sample-card__desc">
              他業種のWeb制作サンプルも順次追加予定です。
            </p>
          </div>
        </div>

      </div>
    </section>

    <footer class="footer">
      <p class="footer__copy">© momo web</p>
    </footer>

  </div>
</body>
</html>
